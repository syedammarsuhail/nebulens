{{- if include "nebulens.serverEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebulens.fullname" . }}
  labels: {{- include "nebulens.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "nebulens.selectorLabels" . | nindent 4 }}
{{- end }}
