{{- if include "nebulens.serverEnabled" . }}
{{- if .Values.highAvailability.podDisruptionBudget.enabled }}
{{- if lt (int .Values.replicaCount) 2 }}
{{- fail "highAvailability.podDisruptionBudget.enabled requires replicaCount >= 2 (a budget over a single replica would block every node drain)." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nebulens.fullname" . }}
  labels: {{- include "nebulens.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.highAvailability.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "nebulens.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
