{{- $lic := default (dict) .Values.license -}}
{{- if and $lic.key (not $lic.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nebulens.fullname" . }}-license
  labels: {{- include "nebulens.labels" . | nindent 4 }}
type: Opaque
stringData:
  license-key: {{ $lic.key | quote }}
{{- end }}
