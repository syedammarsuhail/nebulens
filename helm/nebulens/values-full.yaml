# Everything switched on, for a full test (bare metal or any cluster). Combine with your platform overlay:
#
#   helm upgrade --install nebulens ./helm/nebulens -n observability --create-namespace \
#     -f ./helm/nebulens/values-baremetal.yaml -f ./helm/nebulens/values-full.yaml \
#     --set image.repository=<registry>/nebulens --set-string image.tag=<tag> \
#     --set persistence.storageClass=<your storage class> \
#     --set auth.token=<token> \
#     --set "autoInstrumentation.autoInject.namespaces={<app-ns-1>,<app-ns-2>}" \
#     --wait --timeout 10m
#
# What it turns on:
#   collector        logs, node/pod/cluster metrics, and the OTLP endpoint for traces (every trace kept)
#   ebpf             traces every app in every namespace with no code change and no restart
#   operator         the OpenTelemetry Operator, for in-code spans from language agents
#   autoInject       every 10 minutes, adds the language agent to workloads in the listed namespaces
#                    (each workload restarts once, at most 3 per run)
# Leave opentelemetry-operator.enabled false if the cluster already runs an OpenTelemetry Operator.

collector:
  enabled: true
  traceSamplingPercent: 100     # keep every trace while testing; lower it (e.g. 20) for busy production clusters

ebpf:
  enabled: true

opentelemetry-operator:
  enabled: true

autoInstrumentation:
  enabled: true
  autoInject:
    enabled: true
    dryRun: false               # true = only log what would change
    namespaces: []              # REQUIRED: your application namespaces, e.g. --set "autoInstrumentation.autoInject.namespaces={shop,payments}"
