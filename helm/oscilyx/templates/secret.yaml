{{- if include "oscilyx.serverEnabled" . }}
{{- /* The values overlays ship placeholder tokens. Installing with one of them would make a publicly known value the admin
       password, so refuse instead. */}}
{{- if has (.Values.auth.token | default "") (list "change-me" "set-via--set-or-sealed-secret" "set-via--set-or-a-sealed-secret") }}
{{- fail "auth.token is still the placeholder from the values file. Set a real one: --set auth.token=$(openssl rand -hex 24)" }}
{{- end }}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.token .Values.auth.ingestToken) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oscilyx.fullname" . }}-auth
  labels: {{- include "oscilyx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.token }}
  token: {{ .Values.auth.token | quote }}
  {{- end }}
  {{- if .Values.auth.ingestToken }}
  ingestToken: {{ .Values.auth.ingestToken | quote }}
  {{- end }}
{{- end }}
{{- end }}
