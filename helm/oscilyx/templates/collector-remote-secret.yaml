{{- $remote := default (dict) .Values.collector.remote -}}
{{- if and .Values.collector.enabled $remote.endpoint $remote.token (not $remote.tokenSecret) -}}
# The cluster token this agent uses to send telemetry to a remote Oscilyx console.
# Prefer collector.remote.tokenSecret (an existing Secret) over putting the token in a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oscilyx.fullname" . }}-remote
  labels: {{- include "oscilyx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ default "token" $remote.tokenSecretKey }}: {{ $remote.token | quote }}
{{- end }}
