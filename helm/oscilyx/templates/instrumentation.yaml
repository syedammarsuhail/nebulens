{{- $opOn := (index .Values "opentelemetry-operator").enabled -}}
{{- if and .Values.autoInstrumentation.enabled (or $opOn (.Capabilities.APIVersions.Has "opentelemetry.io/v1alpha1/Instrumentation")) -}}
# Oscilyx Instrumentation CR - consumed by the OpenTelemetry Operator.
# When a pod is annotated, the Operator injects the matching language agent
# as an init container. Zero source code change required.
#
# The Operator comes from either:
#   - this chart:  --set opentelemetry-operator.enabled=true   (use --wait on the first install)
#   - or a separate cluster-wide install of the Operator.
#
# Then opt in per workload (scripts/instrument.sh does this for you). The value is
# "<namespace>/<name>" because your apps live in other namespaces than Oscilyx:
#   instrumentation.opentelemetry.io/inject-python:  "{{ .Release.Namespace }}/oscilyx"
#   instrumentation.opentelemetry.io/inject-java:    "{{ .Release.Namespace }}/oscilyx"
#   instrumentation.opentelemetry.io/inject-nodejs:  "{{ .Release.Namespace }}/oscilyx"
#   instrumentation.opentelemetry.io/inject-dotnet:  "{{ .Release.Namespace }}/oscilyx"
#   instrumentation.opentelemetry.io/inject-go:      "{{ .Release.Namespace }}/oscilyx"
#
# This is a post-install/post-upgrade hook so it is created after the Operator (and its webhook)
# exist. It is kept after "helm uninstall"; remove it with:
#   kubectl delete instrumentation oscilyx -n {{ .Release.Namespace }}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: oscilyx
  labels: {{- include "oscilyx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  exporter:
    # OTLP/HTTP on the bundled collector. HTTP is used for every language because .NET, Python and
    # Node.js agents default to http/protobuf; a gRPC port (4317) would silently fail for them.
    endpoint: http://{{ include "oscilyx.fullname" . }}-collector.{{ .Release.Namespace }}.svc.cluster.local:4319
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "{{ .Values.autoInstrumentation.samplingRatio }}"
  resource:
    addK8sUIDAttributes: true
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    - name: OTEL_METRICS_EXPORTER
      value: otlp
    - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
      value: "true"

  # ---- language-specific agents (fully auto, no code change) ----
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:latest
  go:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:latest
  apacheHttpd:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-apache-httpd:latest
  nginx:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nginx:latest
{{- end }}
