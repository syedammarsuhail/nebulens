# NebuLens on a single Linux VM: server + a host-level OpenTelemetry Collector.
#   cp .env.example .env     # set NEBULENS_TOKEN (and NEBULENS_IMAGE if you use a private registry)
#   docker compose up -d
# UI and OTLP/HTTP: http://<vm-ip>:4318   Apps can also send to the collector on :4317 (gRPC) / :4319 (HTTP).
services:
  nebulens:
    image: ${NEBULENS_IMAGE:-nebulens:0.1.0}
    restart: unless-stopped
    ports:
      - "4318:4318"
    environment:
      NEBULENS_TOKEN: ${NEBULENS_TOKEN:?set NEBULENS_TOKEN in .env}
      NEBULENS_RETENTION_HOURS: ${NEBULENS_RETENTION_HOURS:-72}
      NEBULENS_DB: /data/nebulens.db
    volumes:
      - nebulens-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4318/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      NEBULENS_TOKEN: ${NEBULENS_TOKEN}
    ports:
      - "4317:4317"
      - "4319:4319"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    depends_on:
      nebulens:
        condition: service_healthy

volumes:
  nebulens-data:
