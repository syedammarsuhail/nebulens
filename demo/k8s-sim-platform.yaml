# A simulated 22-service shop that sends realistic traces, logs and metrics to Oscilyx, with deliberate faults
# (payments errors, slow fraud checks, search errors that grow, latency spikes, email bursts) so every page has something to find.
#
#   kubectl create namespace demo
#   kubectl -n demo create secret generic oscilyx-token --from-literal=token=<your Oscilyx token>
#   sed 's#oscilyx-demo:local#<your-registry>/oscilyx-demo:demo#' demo/k8s-sim-platform.yaml | kubectl apply -f -
#
# Remove with:  kubectl delete -f demo/k8s-sim-platform.yaml && kubectl -n demo delete secret oscilyx-token
# Load: BATCH traces per tick every PERIOD seconds, per replica. Raise `replicas` and BATCH for a heavier test.
apiVersion: apps/v1
kind: Deployment
metadata: {name: sim-platform, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: sim-platform}}
  template:
    metadata: {labels: {app: sim-platform}}
    spec:
      containers:
      - name: sim
        image: oscilyx-demo:local
        imagePullPolicy: IfNotPresent
        command: ["python", "-u", "multi_service_load.py"]
        env:
        - {name: OSCILYX_URL, value: "http://oscilyx.observability:4318"}
        - name: OSCILYX_TOKEN
          valueFrom: {secretKeyRef: {name: oscilyx-token, key: token}}
        - {name: BATCH, value: "30"}
        - {name: PERIOD, value: "5"}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
