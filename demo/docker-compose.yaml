services:
  nebulens:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nebulens:local
    ports: ["4318:4318"]
    volumes: [nebulens_data:/data]
    environment:
      NEBULENS_HOST: 0.0.0.0
      NEBULENS_RETENTION_HOURS: "72"

  backend:
    build: .
    image: nebulens-demo:local
    command: >
      opentelemetry-instrument
      uvicorn backend:app --host 0.0.0.0 --port 8001
    environment:
      OTEL_SERVICE_NAME: backend
      OTEL_RESOURCE_ATTRIBUTES: service.version=2.4.1,deployment.environment=demo,team=platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://nebulens:4318
    depends_on: [nebulens]

  frontend:
    image: nebulens-demo:local
    command: >
      opentelemetry-instrument
      uvicorn frontend:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      OTEL_SERVICE_NAME: frontend
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.3.0,deployment.environment=demo,team=storefront
      OTEL_EXPORTER_OTLP_ENDPOINT: http://nebulens:4318
      BACKEND_URL: http://backend:8001
    depends_on: [backend]

  loadgen:
    image: nebulens-demo:local
    command: python loadgen.py
    environment:
      FRONTEND_URL: http://frontend:8000
      RPS: "4"
    depends_on: [frontend]

volumes:
  nebulens_data: {}
