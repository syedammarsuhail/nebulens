# Runs on every push and pull request. The same API suite runs against SQLite AND Postgres, which is how
# SQL that only one database accepts gets caught before release.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          NEBULENS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: lint and render every platform values file
        run: |
          helm lint helm/nebulens --set auth.token=x
          for f in helm/nebulens/values*.yaml; do
            helm template nebulens helm/nebulens -n test -f "$f" --set auth.token=x > /dev/null
            echo "rendered $f"
          done
          helm template nebulens helm/nebulens --set auth.token=x --set opentelemetry-operator.enabled=true > /dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: for f in static/*.js; do node --check "$f"; done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build, then check it starts as a non-root user and reports healthy
        run: |
          docker build -t nebulens:ci .
          test "$(docker run --rm --entrypoint id nebulens:ci -u)" = "1000"
          docker run -d --name nebulens-ci -e NEBULENS_TOKEN=tok nebulens:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' nebulens-ci)" = healthy ] && exit 0; sleep 2; done
          docker logs nebulens-ci; exit 1
