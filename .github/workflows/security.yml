# Security gate: nothing is published unless every scan passes.
#   gate   scripts/release-check.sh: tests, pip-audit, bandit, secrets, paid-code check, helm, UI syntax
#   snyk   Snyk Open Source (dependencies) and Snyk Code (source), blocking at high severity
#   sonar  SonarCloud analysis, waiting for the quality gate (blocking)
#   image  builds the image and publishes it to GHCR, only on a version tag and only after all three passed
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   SNYK_TOKEN         from https://app.snyk.io/account
#   SONAR_TOKEN        from SonarCloud (My Account -> Security)
#   SONAR_ORGANIZATION and SONAR_PROJECT_KEY as repository *variables* (the SonarCloud organization and project key)
# Without them the snyk / sonar jobs fail on purpose: an unscanned build must not be published.
name: Security gate

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20" }
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: bash scripts/release-check.sh

  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock
      - name: Snyk Open Source (dependencies)
        uses: snyk/actions/python-3.10@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        with: { args: --file=requirements.lock --package-manager=pip --severity-threshold=high }
      - name: Snyk Code (source)
        uses: snyk/actions/python-3.10@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        with: { command: code test, args: --severity-threshold=high }

  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.lock -r requirements-dev.txt pytest-cov
      - run: NEBULENS_CACHE_TTL=0 python -m pytest tests -q --cov=. --cov-report=xml:coverage.xml
      - name: SonarCloud scan (waits for the quality gate)
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=server.py,integrations.py,static/,scripts/
            -Dsonar.tests=tests/
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.12
            -Dsonar.qualitygate.wait=true

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, snyk, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
