<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NebuLens - Observability</title>
<script>try{var t=localStorage.getItem("p0.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%233d6df2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2.8' fill='white'/%3E%3Cpath d='M8.2 9.6a4.4 4.4 0 0 1 2.2-2.2' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
<header id="top">
  <a class="brand" href="#/home" title="NebuLens home"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle class="core" cx="12" cy="12" r="3"/><path class="glint" d="M7.6 9.4a5 5 0 0 1 2.6-2.5"/></svg></span><b>NebuLens</b></a>
  <button id="search-btn" class="search" title="Search (Ctrl+K)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search services, traces, metrics, pages…</span><kbd>Ctrl K</kbd>
  </button>
  <div class="top-right">
    <button id="ask-btn" class="btn accent" title="Ask NebuLens (rule-based investigation)">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      Ask NebuLens
    </button>
    <div id="range-wrap" class="menu-wrap">
      <button id="range-btn" class="btn" title="Time range"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="range-label">Last 1 hour</span><i class="caret"></i></button>
    </div>
    <button id="refresh" class="btn icon" title="Refresh now"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <label class="switch" title="Auto-refresh every 15s"><input type="checkbox" id="auto" checked/><span></span><em>Auto</em></label>
    <button id="whoami" class="btn" hidden title="Signed in"></button>
    <button id="theme" class="btn icon" title="Toggle light / dark theme"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <div class="live" id="live" title="Connection to NebuLens"><span class="dot"></span><span id="status">connecting</span></div>
  </div>
</header>

<div id="shell">
  <nav id="rail" aria-label="Main navigation"></nav>
  <section id="content">
    <div id="crumbs"></div>
    <main id="main" tabindex="-1"></main>
  </section>
</div>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<aside id="ask" class="drawer ask" aria-hidden="true"></aside>
<div id="palette" class="palette" hidden></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script src="/static/core.js"></script>
<script src="/static/views.js"></script>
<script src="/static/views2.js"></script>
<script src="/static/mapkit.js"></script>
<script src="/static/map.js"></script>
<script src="/static/assistant.js"></script>
<script src="/static/tenancy.js"></script>
<script src="/static/clusters.js"></script>
<script>NebuLens.start()</script>
</body>
</html>
